name: Automatisation des tests DevSecOps
on: push
jobs:
  Dependances:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4
      - name: Dependances
        run: |
          docker run --rm -v "$PWD":/project aquasec/trivy:latest fs \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            /project/requirements.txt

  Dockerfile:
    runs-on: ubuntu-latest
    needs: Dependances
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4
      - name: Test Dockerfile
        run: |
          echo "===== 1. Scan du Dockerfile ====="
          docker run --rm -v "$PWD":/project aquasec/trivy:latest config \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            /project

          echo "===== 2. Build de l'image ====="
          docker build -t breakableflask:${{ github.sha }} .

          echo "===== 3. Scan de l'image ====="
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            breakableflask:${{ github.sha }}

  Deploy:
    runs-on: ubuntu-latest
    needs: Dockerfile
    steps:
      - name: Deploy
        run: |
          echo "Rien à faire ici. Votre application est prête à être déployée"
